[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-swing-analyzer"
version = "0.1.0"
description = "Research-oriented cryptocurrency market data and swing analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1.0",
    "pandas>=2.2,<3.0",
    "pyarrow>=15,<22",
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2.0",
    "pandas-stubs>=2.2,<3.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.12,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that access external services",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["crypto_analyzer"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
